<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="side" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>
        <svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true">
          <path class="m-left" d="M12 2.5A9 9 0 0 0 12 20.5Z" />
          <path class="m-right" d="M14 5.5A9 9 0 0 1 14 23.5Z" />
        </svg>
        <span>PHASE</span>
      </span>
      <!-- Moon used as the install progress indicator: the lit part grows with progress.
           The lit crescent is a single vector path (outer limb arc + terminator arc), with no
           masks or clip paths, so WebView2 antialiases its edge like any other shape. -->
      <svg class="moon" viewBox="-60 -60 520 520" shape-rendering="geometricPrecision" aria-hidden="true">
        <defs>
          <radialGradient id="moon-halo" cx="200" cy="200" r="260" gradientUnits="userSpaceOnUse">
            <stop offset="0.66" stop-color="#2f5bff" stop-opacity="0.22" />
            <stop offset="1" stop-color="#2f5bff" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="moon-night" cx="300" cy="120" r="330" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1a2340" />
            <stop offset="1" stop-color="#0a0f1e" />
          </radialGradient>
          <linearGradient id="moon-day" x1="220" y1="20" x2="380" y2="380" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#d7e2ff" />
          </linearGradient>
          <linearGradient id="moon-limb" x1="200" y1="10" x2="200" y2="390" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7dd3fc" stop-opacity="0" />
            <stop offset="0.5" stop-color="#7dd3fc" />
            <stop offset="1" stop-color="#2f5bff" stop-opacity="0" />
          </linearGradient>
        </defs>
        <circle cx="200" cy="200" r="260" fill="url(#moon-halo)" />
        <!-- The night disc is a hair smaller than the lit path so no dark fringe shows on the limb. -->
        <circle cx="200" cy="200" r="189.5" fill="url(#moon-night)" />
        <path id="moon-lit" fill="url(#moon-day)" d="M200 10A190 190 0 0 1 200 390A144.4 190 0 0 0 200 10Z" />
        <!-- Thin light on the lit limb: an open arc, the same "phase" as in the logo and on the site. -->
        <path class="moon-limb" d="M200 10A190 190 0 0 1 200 390" fill="none" stroke="url(#moon-limb)" stroke-width="1.6" />
      </svg>
    </aside>

    <div class="pane">
      <header class="topbar" data-tauri-drag-region>
        <div class="top-actions">
          <button
            id="lang-button"
            class="lang-button"
            type="button"
            popovertarget="lang-menu"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="6.25" />
              <path d="M1.75 8h12.5M8 1.75c2 2 2.75 4 2.75 6.25S10 12.25 8 14.25C6 12.25 5.25 10.25 5.25 8S6 3.75 8 1.75Z" />
            </svg>
            <span id="lang-current"></span>
            <svg class="chevron" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M2 3.75 5 6.75l3-3" />
            </svg>
          </button>
          <button id="win-min" class="win-button" type="button" data-i18n-label="window.minimize">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 8.5h9" /></svg>
          </button>
          <button id="win-close" class="win-button" type="button" data-i18n-label="window.close">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
          </button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>

    <div id="lang-menu" class="popover" popover role="menu" data-i18n-label="lang.label"></div>

    <script src="app.js"></script>
  </body>
</html>
