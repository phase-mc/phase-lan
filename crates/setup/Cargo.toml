[package]
name = "phase-setup"
description = "Phase installer for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The install logic is a library without Tauri: its tests don't pull in a window.
[lib]
name = "phase_setup"
path = "src/lib.rs"

[[bin]]
name = "phase-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
# Compression of Phase.exe at build time. No C code, already in Tauri's dependency tree.
brotli = "=9.1.1"
sha2 = "0.10.9"

[dependencies]
brotli-decompressor = "=6.3.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
# The installer window: only what it needs (no tray or the rest).
tauri = { version = "2.12.5", default-features = false, features = ["wry", "common-controls-v6", "compression"] }

[dev-dependencies]
brotli = "=9.1.1"

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"
# Shortcuts: the COM interfaces IShellLink and IPropertyStore.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
