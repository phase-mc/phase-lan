[package]
name = "phase-cli"
description = "Phase: console version"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
phase-lang = { path = "../lang" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
phase-core = { path = "../core" }
phase-minecraft = { path = "../minecraft" }
phase-tunnel = { path = "../tunnel" }
n0-future = "0.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
