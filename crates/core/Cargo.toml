[package]
name = "phase-core"
description = "Phase: host and guest sessions for any interface (console, desktop window)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
phase-lang = { path = "../lang" }
anyhow = "1.0.104"
phase-minecraft = { path = "../minecraft" }
phase-tunnel = { path = "../tunnel" }
n0-future = "0.3"
# Search and download of mods from Modrinth (modrinth.rs). Same capabilities as iroh has:
# no new dependencies in the build.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# Verifies a profile's downloaded mods against the SHA-512 from Modrinth (already in the build via iroh).
sha2 = "0.10"
# HTTPS encryption for reqwest: the same one iroh uses (ring).
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
# CancellationToken: stops a session (already used inside iroh).
tokio-util = "0.7.20"
tracing = "0.1.44"
# Log layer for the interface (logs.rs).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }

[lints.rust]
# A private build adds a `client` feature; its code is not part of this repository.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("client"))'] }
