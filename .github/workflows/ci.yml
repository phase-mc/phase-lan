name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  window:
    name: Window (Svelte)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  rust:
    name: Clippy and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json
      # The Rust part of the window embeds the built frontend (frontendDist), so build it first.
      - name: Install window dependencies
        working-directory: crates/gui
        run: npm ci --no-audit --no-fund
      - name: Build the window frontend
        working-directory: crates/gui
        run: npm run build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
