name: Bug report
description: Something in Phase LAN does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check that the bug is not already reported.
        Security problems go to the Security tab, not here (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the world to LAN
        2. Create a room in Phase
        3. ...
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role in the room
      options:
        - Host
        - Guest
        - Both / not related to a room
    validations:
      required: true
  - type: input
    id: phase-version
    attributes:
      label: Phase version
      description: Shown on the Network tab.
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version and mod loader
      placeholder: "1.21.1, Fabric 0.16.x (or vanilla)"
  - type: dropdown
    id: connection
    attributes:
      label: Connection route
      description: Shown in the room popover.
      options:
        - Direct
        - Relay
        - Could not connect
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        Copy the relevant lines from the Log tab (System). Please remove IP addresses and
        device IDs if you do not want to share them publicly.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, mods in use, network setup (VPN, mobile internet, strict NAT).
